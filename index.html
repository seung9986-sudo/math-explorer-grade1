<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#fff8e9"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>수학 탐험대</title>
<style>
:root{--ink:#26334a;--muted:#68758a;--blue:#5368e8;--sky:#e9f0ff;--yellow:#ffd864;--mint:#d8f5e7;--pink:#ffe0e8;--paper:#fffdf8}*{box-sizing:border-box}body{margin:0;background:#fff8e9;color:var(--ink);font-family:ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Noto Sans KR",sans-serif;min-height:100vh;display:flex;justify-content:center}.app{width:min(100%,560px);min-height:100vh;padding:18px 20px 28px;display:flex;flex-direction:column}.top{display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:10px;font-size:19px;font-weight:900}.logo{width:42px;height:42px;border-radius:15px;background:var(--yellow);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 #eab944}.streak{background:#fff;border-radius:20px;padding:9px 14px;font-weight:800;color:#e28c25;box-shadow:0 3px 10px #4433110d}.hello{margin:25px 2px 17px}.hello h1{font-size:27px;line-height:1.25;margin:0 0 6px;letter-spacing:-.8px}.hello p{margin:0;color:var(--muted);font-size:15px}.progress-wrap{background:#fff;border-radius:18px;padding:13px 16px;margin-bottom:17px}.progress-head{display:flex;justify-content:space-between;font-weight:800;font-size:13px;margin-bottom:9px}.track{height:11px;border-radius:12px;background:#edf0f5;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#69d4a0,#52bc8d);border-radius:12px;transition:width .35s}.card{background:white;border-radius:28px;padding:22px 20px 20px;box-shadow:0 12px 30px #47371c12;flex:1;display:flex;flex-direction:column;min-height:390px}.q-top{display:flex;justify-content:space-between;align-items:center}.tag{background:var(--sky);color:#5266d7;border-radius:12px;padding:8px 12px;font-size:13px;font-weight:900}.q-number{color:#9aa3b2;font-size:13px;font-weight:800}.prompt{text-align:center;padding:20px 0 10px}.emoji{font-size:46px;height:53px}.equation{font-size:54px;font-weight:950;letter-spacing:1px;margin:7px 0 0}.equation .op{color:#f0ae2e}.hint{color:#8b95a5;font-size:14px;margin:8px 0 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:18px 0 12px}.answer{border:2px solid #e8ecf3;border-radius:18px;min-height:64px;background:#fff;font-size:25px;font-weight:900;color:var(--ink);cursor:pointer;box-shadow:0 3px 0 #edf0f4;transition:transform .12s,border .12s,background .12s}.answer:active{transform:translateY(2px);box-shadow:none}.answer:hover{border-color:#aab6ff;background:#f7f8ff}.answer.correct{border-color:#5dc48f;background:#e7f9ef;color:#218750}.answer.wrong{border-color:#f28aa1;background:#fff0f3;color:#d04f69}.feedback{min-height:48px;text-align:center;font-size:17px;font-weight:900;padding:8px 0 0}.feedback.good{color:#248d5b}.feedback.try{color:#d45b70}.next{display:none;border:0;border-radius:16px;background:var(--blue);color:white;font-size:18px;font-weight:900;padding:15px;cursor:pointer;box-shadow:0 4px 0 #394ac0;margin-top:auto}.next.show{display:block}.bottom{font-size:12px;color:#9aa3b2;text-align:center;padding:14px 0 0}.overlay{position:fixed;inset:0;background:#26334a77;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.modal{width:min(100%,430px);background:#fffdf8;border-radius:28px;padding:30px 24px;text-align:center;box-shadow:0 20px 50px #1d274133}.medal{font-size:72px}.modal h2{font-size:28px;margin:8px 0}.modal p{color:var(--muted);font-size:16px;line-height:1.6}.modal button{border:0;background:var(--blue);color:white;border-radius:16px;padding:15px 28px;font-size:17px;font-weight:900;margin-top:8px}.confetti{font-size:23px;letter-spacing:8px;color:#f2b735}@media(min-height:850px){.app{padding-top:25px}.hello{margin-top:35px}.card{padding:27px 24px}.prompt{padding-top:32px}.answers{margin-top:25px}}
</style></head>
<body><main class="app"><header class="top"><div class="brand"><div class="logo">🧭</div><span>수학 탐험대</span></div><div class="streak">⭐ <span id="stars">0</span></div></header><section class="hello"><h1>오늘도 멋진 수학 탐험! 🚀</h1><p>천천히 생각하면 답이 보여요.</p></section><section class="progress-wrap"><div class="progress-head"><span>오늘의 미션</span><span id="progressText">0 / 10 문제</span></div><div class="track"><div class="fill" id="progressFill"></div></div></section><section class="card"><div class="q-top"><span class="tag" id="kind">➕ 덧셈 연습</span><span class="q-number" id="qNum">1번째 문제</span></div><div class="prompt"><div class="emoji" id="emoji">🍎</div><div class="equation" id="equation">3 <span class="op">+</span> 4 <span class="op">=</span> ?</div><p class="hint" id="hint">답을 골라 주세요!</p></div><div class="answers" id="answers"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">다음 문제 →</button></section><div class="bottom">맞혀도, 틀려도 괜찮아요. 도전하는 게 최고예요! 💛</div></main><div class="overlay" id="overlay"><div class="modal"><div class="confetti">✦ ✧ ✦ ✧ ✦</div><div class="medal">🏅</div><h2>미션 성공!</h2><p id="resultText">10문제를 모두 풀었어요!</p><button id="again">한 번 더 도전하기</button></div></div>
<script>
const TOTAL=10, emojis=['🍎','🐰','⭐','🍓','🐥','🐳','🍪','🦋','🚗','🌼'];let question=0,stars=0,answer=0,locked=false,subtraction=false;
const $=id=>document.getElementById(id);
function makeQuestion(){locked=false;$('feedback').textContent='';$('feedback').className='feedback';$('next').classList.remove('show');$('hint').textContent='답을 골라 주세요!';let a,b;subtraction=Math.random()<.38;if(subtraction){a=2+Math.floor(Math.random()*9);b=Math.floor(Math.random()*(a+1));answer=a-b}else{a=Math.floor(Math.random()*10);b=Math.floor(Math.random()*(11-a));answer=a+b}$('kind').textContent=subtraction?'➖ 뺄셈 연습':'➕ 덧셈 연습';$('qNum').textContent=(question+1)+'번째 문제';$('emoji').textContent=emojis[question%emojis.length];$('equation').innerHTML=`${a} <span class="op">${subtraction?'−':'+'}</span> ${b} <span class="op">=</span> ?`;let vals=new Set([answer]);while(vals.size<4){let v=answer+Math.floor(Math.random()*7)-3;if(v>=0&&v<=18)vals.add(v)}let arr=[...vals].sort(()=>Math.random()-.5);$('answers').innerHTML='';arr.forEach(v=>{let btn=document.createElement('button');btn.className='answer';btn.textContent=v;btn.onclick=()=>choose(v,btn);$('answers').append(btn)});updateProgress()}
function choose(v,btn){if(locked)return;if(v===answer){locked=true;btn.classList.add('correct');stars++;$('stars').textContent=stars;$('feedback').textContent=['정답이에요! 정말 잘했어요! 🎉','맞았어요! 수학 탐험가 최고! 🌟','와, 멋지게 풀었어요! 👏'][Math.floor(Math.random()*3)];$('feedback').className='feedback good';$('hint').textContent='';document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('next').textContent=question===TOTAL-1?'결과 보기 🏅':'다음 문제 →';$('next').classList.add('show')}else{btn.classList.add('wrong');btn.disabled=true;$('feedback').textContent='아깝다! 다시 생각해 볼까요? 😊';$('feedback').className='feedback try';$('hint').textContent='손가락으로 세어 봐도 좋아요!'}}
function updateProgress(){$('progressText').textContent=`${question} / ${TOTAL} 문제`;$('progressFill').style.width=`${question/TOTAL*100}%`}
$('next').onclick=()=>{question++;if(question>=TOTAL){$('progressText').textContent=`${TOTAL} / ${TOTAL} 문제`;$('progressFill').style.width='100%';$('resultText').textContent=`문제 ${TOTAL}개를 모두 풀었어요. 별 ${stars}개를 모았어요! 정말 대단해요!`;$('overlay').classList.add('show')}else makeQuestion()};$('again').onclick=()=>{$('overlay').classList.remove('show');question=0;stars=0;$('stars').textContent='0';makeQuestion()};makeQuestion();
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(() => {})); }
</script></body></html>
